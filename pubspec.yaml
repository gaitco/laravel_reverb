name: laravel_reverb
description: Laravel Reverb realtime client for Flutter. Echo-style API, pure Dart Pusher protocol, auto-reconnect, presence channels and client events.
# Kept in sync with Reverb.clientVersion in lib/src/reverb.dart —
# test/version_test.dart fails if the two drift.
version: 0.4.0
homepage: https://gaitco.com
repository: https://github.com/gaitco/laravel_reverb
issue_tracker: https://github.com/gaitco/laravel_reverb/issues
documentation: https://pub.dev/documentation/laravel_reverb/latest/

topics:
  - laravel
  - reverb
  - websocket
  - realtime
  - pusher

screenshots:
  - description: >-
      How laravel_reverb sits between a Flutter app and a Laravel Reverb server,
      including the /broadcasting/auth call that signs private channels.
    path: assets/architecture.png

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  stream_channel: ^2.1.2
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
