name: flutter_reverb
description: Laravel Reverb realtime client for Flutter. Echo-style API, pure Dart Pusher protocol, auto-reconnect, presence channels and client events.
# Kept in sync with Reverb.clientVersion in lib/src/reverb.dart by hand —
# bump both on every release, or the socket URL ships a stale `version=`.
version: 0.1.0
homepage: https://gaitco.com
repository: https://github.com/gaitco/flutter_reverb
issue_tracker: https://github.com/gaitco/flutter_reverb/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  stream_channel: ^2.1.2
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1
